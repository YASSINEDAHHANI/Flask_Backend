services:
  # ============================================
  # MongoDB — users, projects, history, etc.
  # ============================================
  mongodb:
    image: mongo:7
    container_name: dxc_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - dxc_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MinIO — PDF object storage
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: dxc_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dxc_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Flask backend (uses Azure OpenAI for LLM)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dxc_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - chroma_data:/app/chroma_db_minio
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dxc_net

networks:
  dxc_net:
    driver: bridge

volumes:
  mongodb_data:
  minio_data:
  chroma_data: